name: nhtsa-lakehouse

x-app: &app
  build: .
  image: nhtsa-lakehouse-app:dev
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    MINIO_ENDPOINT: http://minio:9000
  depends_on:
    postgres:
      condition: service_healthy
    minio:
      condition: service_healthy
  volumes:
    - duckdb_data:/data/duckdb

services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # Official MinIO images are no longer published publicly; Bitnami's frozen
    # build is used for local development.
    image: bitnamilegacy/minio:2025.4.22
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_DEFAULT_BUCKETS: ${LAKEHOUSE_BUCKET}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot run of the full pipeline on `docker compose up`
  # (bronze -> dbt silver/gold -> Soda -> Iceberg). Recorded in Dagster like any other run.
  pipeline:
    <<: *app
    command: ["dagster", "job", "execute", "-m", "orchestration.definitions", "-j", "daily_pipeline"]
    restart: "no"

  dagster-webserver:
    <<: *app
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/home/workspace.yaml"]
    ports:
      - "3000:3000"

  dagster-daemon:
    <<: *app
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/home/workspace.yaml"]

  # --- Phase 4: assistant -----------------------------------------------------
  ollama:
    image: ollama/ollama:0.11.4
    environment:
      # One request and one model at a time: the KV cache is allocated per parallel slot,
      # 4 slots (default) would take ~6.7 GB for a 4B model instead of ~3.5 GB.
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot download of the LLM into the ollama volume (skipped when already present).
  ollama-pull:
    image: ollama/ollama:0.11.4
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
      OLLAMA_URL: http://ollama:11434
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    ports:
      - "8000:8000"

  ui:
    <<: *app
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--browser.gatherUsageStats", "false"]
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

  # --- Phase 5: LLM observability (optional: docker compose --profile observability up -d langfuse) ---
  # Langfuse v2 only needs Postgres: it reuses the stack's server, in its own schema.
  langfuse:
    image: langfuse/langfuse:2.95.11
    profiles: ["observability"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-local-dev-secret}
      SALT: ${LANGFUSE_SALT:-local-dev-salt}
      TELEMETRY_ENABLED: "false"
      # Headless init: organisation, project, API keys and a local admin account.
      LANGFUSE_INIT_ORG_ID: nhtsa
      LANGFUSE_INIT_ORG_NAME: NHTSA lakehouse
      LANGFUSE_INIT_PROJECT_ID: nhtsa-rag
      LANGFUSE_INIT_PROJECT_NAME: nhtsa-rag
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PUBLIC_KEY:-pk-lf-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_SECRET_KEY:-sk-lf-local}
      LANGFUSE_INIT_USER_EMAIL: admin@langfuse.local
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:-admin12345}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"

volumes:
  ollama_models:
  pg_data:
  minio_data:
  duckdb_data:
