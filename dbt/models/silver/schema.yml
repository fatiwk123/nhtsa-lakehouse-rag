version: 2

models:
  - name: silver_recalls
    description: Cleaned recalls, one row per (campaign, vehicle). Make/model normalised, deduplicated on the latest ingestion.
    columns:
      - name: recall_key
        tests: [unique, not_null]
      - name: campaign_number
        tests: [not_null]
      - name: make
        tests: [not_null]
      - name: model
        tests: [not_null]
      - name: model_year
        tests: [not_null]
      - name: report_received_date
        tests: [not_null]

  - name: silver_complaints
    description: Cleaned complaints, one row per (complaint, vehicle). One complaint can concern several vehicles.
    columns:
      - name: complaint_vehicle_key
        tests: [unique, not_null]
      - name: odi_number
        tests: [not_null]
      - name: make
        tests: [not_null]
      - name: model
        tests: [not_null]
      - name: complaint_filed_date
        tests: [not_null]

  - name: silver_complaint_components
    description: Complaint components exploded, one row per (complaint, vehicle, component group).
    columns:
      - name: component_group
        tests: [not_null]
