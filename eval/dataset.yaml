  # --- SQL: counts, rankings, dates ------------------------------------------------------------------
  - id: sql-01
    type: sql
    question: Combien de plaintes moteur pour Volkswagen ont été déposées en 2025 ?
    expect: scalar
    reference_sql: >
      SELECT count(DISTINCT c.odi_number) FROM fct_complaints c
      JOIN bridge_complaint_component b ON b.odi_number = c.odi_number AND b.vehicle_key = c.vehicle_key
      WHERE b.category = 'ENGINE' AND year(c.complaint_filed_date) = 2025
  - id: sql-02
    type: sql
    question: Quels modèles VW ont le plus de plaintes avec incendie ?
    expect: top3
    reference_sql: >
      SELECT model, count(DISTINCT odi_number) n FROM fct_complaints WHERE fire GROUP BY model ORDER BY n DESC, model LIMIT 3
  - id: sql-03
    type: sql
    question: Combien de campagnes de rappel concernent l'Atlas 2018 ?
    expect: scalar
    reference_sql: SELECT count(DISTINCT campaign_number) FROM fct_recalls WHERE model = 'ATLAS' AND model_year = 2018
  - id: sql-04
    type: sql
    question: Combien de rappels liés aux airbags y a-t-il au total ?
    expect: scalar
    reference_sql: SELECT count(DISTINCT campaign_number) FROM fct_recalls WHERE category = 'AIRBAGS'
  - id: sql-05
    type: sql
    question: Quel modèle a le plus de campagnes de rappel ?
    expect: top1
    reference_sql: SELECT model, count(DISTINCT campaign_number) n FROM fct_recalls GROUP BY model ORDER BY n DESC, model LIMIT 1
  - id: sql-06
    type: sql
    question: Combien de plaintes au total pour la Jetta 2019 ?
    expect: scalar
    reference_sql: SELECT count(DISTINCT odi_number) FROM fct_complaints WHERE model = 'JETTA' AND model_year = 2019
  - id: sql-07
    type: sql
    question: Combien de plaintes signalent un accident (crash) pour le Tiguan 2018 ?
    expect: scalar
    reference_sql: SELECT count(DISTINCT odi_number) FROM fct_complaints WHERE model = 'TIGUAN' AND model_year = 2018 AND crash
  - id: sql-08
    type: sql
    question: Quelles sont les 3 catégories de composants avec le plus de plaintes ?
    expect: top3
    reference_sql: >
      SELECT category, count(DISTINCT odi_number) n FROM bridge_complaint_component GROUP BY category ORDER BY n DESC, category LIMIT 3
  - id: sql-09
    type: sql
    question: Combien de blessés au total sont déclarés dans les plaintes sur la Passat ?
    expect: scalar
    reference_sql: >
      SELECT coalesce(sum(n), 0) FROM (SELECT DISTINCT odi_number, number_of_injuries n FROM fct_complaints WHERE model = 'PASSAT')
  - id: sql-10
    type: sql
    question: Combien de rappels demandent de garer le véhicule (park it) ?
    expect: scalar
    reference_sql: SELECT count(DISTINCT campaign_number) FROM fct_recalls WHERE park_it
  - id: sql-11
    type: sql
    question: Combien de plaintes freinage pour l'Atlas, toutes années confondues ?
    expect: scalar
    reference_sql: >
      SELECT count(DISTINCT c.odi_number) FROM fct_complaints c
      JOIN bridge_complaint_component b ON b.odi_number = c.odi_number AND b.vehicle_key = c.vehicle_key
      WHERE c.model = 'ATLAS' AND b.category = 'BRAKES'
  - id: sql-12
    type: sql
    question: En quelle année a-t-on déposé le plus de plaintes sur la Golf ?
    expect: top1
    reference_sql: >
      SELECT year(complaint_filed_date) y, count(DISTINCT odi_number) n FROM fct_complaints
      WHERE model = 'GOLF' AND complaint_filed_date IS NOT NULL GROUP BY y ORDER BY n DESC, y LIMIT 1
  - id: sql-13
    type: sql
    question: Combien de modèles Volkswagen différents ont au moins un rappel ?
    expect: scalar
    reference_sql: SELECT count(DISTINCT model) FROM fct_recalls
  - id: sql-14
    type: sql
    question: Combien de plaintes mentionnent un incendie pour l'Atlas Cross Sport ?
    expect: scalar
    reference_sql: SELECT count(DISTINCT odi_number) FROM fct_complaints WHERE model = 'ATLAS CROSS SPORT' AND fire

