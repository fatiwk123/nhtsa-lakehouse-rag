name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: CPU-only PyTorch
        run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: dbt parse (project compiles)
        working-directory: dbt
        run: dbt parse --profiles-dir .

  terraform:
    # Static checks only (no AWS credentials): formatting and a valid configuration.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  pipeline-and-eval:
    # End-to-end on the evaluation scope (Volkswagen 2018-2020): NHTSA API -> bronze Iceberg -> dbt build
    # (models + tests) -> Soda -> Iceberg -> recall PDFs -> RAG index + sync check, then the retrieval
    # evaluation (no LLM) gated against eval/baseline.json: a quality drop fails the PR.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cp .env.example .env
      - name: Run the full pipeline
        run: docker compose up --build --exit-code-from pipeline pipeline
      - name: Retrieval evaluation (recall@k, MRR, "je ne sais pas" threshold)
        run: |
          mkdir -p eval/results && chmod 777 eval/results
          docker compose run --rm -v "$PWD/eval/results:/app/eval/results" pipeline python -m eval.retrieval_eval
      - name: Regression gate
        run: docker compose run --rm -v "$PWD/eval/results:/app/eval/results" pipeline python -m eval.check_regression
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
