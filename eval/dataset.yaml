#
# type: doc   -> answer is in the recall documents; `relevant` = campaign numbers whose passages answer it
#                (retrieval: a hit is relevant when its document belongs to one of these campaigns).
#                `must_mention` (optional): terms the answer must contain (case-insensitive, any one of each list).
# type: sql   -> numeric / ranking answer; `reference_sql` is run on the gold tables at eval time, so the
#                expected value follows the data. `expect`: scalar (first cell must appear in the answer)
#                or top3 (first column of the first 3 rows must appear).
# type: out_of_scope -> nothing in the corpus answers it: the assistant must say "je ne sais pas".

